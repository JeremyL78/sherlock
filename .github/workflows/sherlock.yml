name: Sherlock Username Search

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Username to search"
        required: true
        type: string

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sherlock
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Sherlock
        env:
          SEARCH_USERNAME: ${{ inputs.username }}
        run: |
          mkdir -p results
          sherlock "$SEARCH_USERNAME" \
            --folderoutput results \
            --csv \
            --print-found

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-results
          path: results/
          if-no-files-found: warn
          retention-days: 7